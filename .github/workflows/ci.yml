name: ci

on:
  push:
    branches: ['**'] # tags run release.yml
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests (logic, sim, real NTFS ACLs)
        run: dotnet test Owlseye.slnx -c Release
      - name: Exe and native libraries (publish folder)
        shell: pwsh
        run: ./build-windows.ps1 -SkipTests
      # No UI smoke test here: on GitHub's runners WebView2 never opens the debugging port the test drives the window
      # through. It runs locally (node tests/e2e/smoke.mjs publish/owlseye.exe) before a release is tagged.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owlseye
          path: publish/
